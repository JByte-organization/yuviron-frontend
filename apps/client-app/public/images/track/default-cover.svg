<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F1724" />
      <stop offset="100%" stop-color="#020A13" />
    </radialGradient>

    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00A6FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#BEF4FF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BEF4FF" />
      <stop offset="100%" stop-color="#00A6FF" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#bgGrad)" rx="0" />

  <circle cx="150" cy="150" r="120" fill="url(#glowGrad)" />

  <circle cx="150" cy="150" r="85" fill="none" stroke="#00A6FF" stroke-width="1" stroke-opacity="0.15" />
  <circle cx="150" cy="150" r="65" fill="none" stroke="#BEF4FF" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="4 8" />
  <circle cx="150" cy="150" r="45" fill="none" stroke="#00A6FF" stroke-width="1.5" stroke-opacity="0.2" />

  <g filter="url(#neonGlow)">
    <path d="M 85 150 L 100 150 M 200 150 L 215 150" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 90 135 L 100 138 M 200 138 L 210 135" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 90 165 L 100 162 M 200 162 L 210 165" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

    <path d="M140,165 C140,173.28 133.28,180 125,180 C116.72,180 110,173.28 110,165 C110,156.72 116.72,150 125,150 C128.4,150 131.51,151.13 134,153.03 L134,120 L175,110 L175,135 L140,144" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
